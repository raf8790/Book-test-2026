<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f5b">
  <meta name="description" content="Mobile-friendly web application">
  <title>My Web App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: linear-gradient(135deg, #087f5b, #075985);
      color: white;
      padding: 18px 12px;
      text-align: center;
    }

    header h2 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: white;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .open-btn {
      background: #087f5b;
      color: white;
    }

    .refresh-btn {
      background: #e0f2fe;
      color: #075985;
    }

    main {
      padding: 6px;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100dvh - 145px);
      min-height: 450px;
      border: 0;
      border-radius: 8px;
      background: white;
    }

    footer {
      padding: 8px;
      text-align: center;
      color: #64748b;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <header>
    <h2>My Web App</h2>
    <p>Fast • Secure • Mobile Friendly</p>
  </header>

  <div class="toolbar">
    <button class="open-btn" onclick="openApp()">
      Open App ↗
    </button>

    <button class="refresh-btn" onclick="refreshApp()">
      Refresh ↻
    </button>
  </div>

  <main>
    <iframe
      id="appFrame"
      title="Web Application"
      src="https://script.google.com/macros/s/AKfycbyYm9zkBkxBGdMfjUJYJ2cEanOOx7sc-Ff-Ft8rbr7bqcJciBxxVZs5V_DELB9MPmw/exec"
      allow="clipboard-read; clipboard-write"
      loading="eager">
    </iframe>
  </main>

  <footer>
    Web Application
  </footer>

  <script>
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbyYm9zkBkxBGdMfjUJYJ2cEanOOx7sc-Ff-Ft8rbr7bqcJciBxxVZs5V_DELB9MPmw/exec";

    function openApp() {
      window.open(APP_URL, "_blank");
    }

    function refreshApp() {
      document.getElementById("appFrame").src = APP_URL;
    }
  </script>

</body>
</html>
